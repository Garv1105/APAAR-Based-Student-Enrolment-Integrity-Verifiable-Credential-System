# Fault and scenario configuration for synthetic.generate
# Codes match docs/APAAR_SIH_Reference.md §9.3. Every injected item is written to ground_truth.json.

academic_year: "2026-27"
history_years: ["2023-24", "2024-25", "2025-26"]

calendar:
  # PLACEHOLDER: set from the AICTE academic calendar for the year you demo.
  admission_window: ["2026-07-01", "2026-09-15"]   # outside -> E403 (warning)
  reporting_deadline: "2026-10-15T23:59:00+05:30"  # mutations after this -> E501
  uploads_between: ["2026-09-16", "2026-10-14"]

age_bounds: [15, 35]     # admission age outside -> E402 (warning)

# Seat-category caps. PLACEHOLDER values marked verify=true MUST be replaced with
# rules/apaar_rules/seat_categories.yaml once T0.4 is done (pass --seat-config).
seat_categories:
  REGULAR:  {scope: within_intake}
  TFW:      {scope: supernumerary, pool: TFW, pct_of_intake: 5, verify: true}
  FN:       {scope: supernumerary, pool: FOREIGN}
  OCI:      {scope: supernumerary, pool: FOREIGN}
  CIWG:     {scope: supernumerary, pool: FOREIGN}
  NRI:      {scope: supernumerary, pool: FOREIGN}       # fills vacant FN/OCI/CIWG seats, with AICTE approval [S1]
  LATERAL:  {scope: supernumerary, pool: LATERAL, pct_of_intake: 10, verify: true, year_of_study: 2}
pools:
  FOREIGN: {pct_of_intake: 15, sub_caps: {CIWG: 0.3333333333}}   # 15%, 1/3 of it for CIWG [S1]

# Normal data shape
fill_ratio_beta: [8.0, 1.5]        # mean ~0.84 (≈16% vacancy, reference §2.1)
apaar_prefix: "9"                  # synthetic IDs start with this digit
apaar_reason_share: 0.015          # legitimately missing APAAR with reason (E101W), per row

# Row-level faults: rate per 1000 eligible rows
row_faults:
  E101_missing_no_reason: 2
  E102_invalid_format: 3
  E103_not_in_registry: 2
  E104_details_mismatch: 2
  E201_duplicate_in_file: 2
  E401_inconsistent_category: 1.5
  E402_implausible_age: 1
  E403_admission_outside_window: 1.5
  E404_lateral_in_year1: 1

# Cross-row / cross-batch faults: absolute counts
cross_faults:
  E202_duplicate_in_institution: 15     # same student again in the institution's 2nd batch
  E203_cross_institution_exact: 25      # same APAAR active in two institutions
  E204_cross_institution_fuzzy: 15      # no APAAR at second institution, name variant, same DOB+guardian

# Programme / batch level: absolute counts
programme_faults:
  E301_excess_over_intake: 3
  E302_category_cap: 2
  E303_declared_mismatch: 3
  E304_closed_institution: 1

anomalies:
  enrolment_spike: 2
  category_mix_shift: 1
  dob_cluster: {count: 1, size: 25}
  sequential_apaar: {count: 1, run: 30}
  deadline_dump: 1

mutations:
  post_deadline: 10   # -> E501
  pre_deadline: 10    # negatives

negatives:
  withdrawn_then_reenrolled: 10   # must NOT raise E203
  twins: 10                       # must NOT raise E201/E204
  transliteration_variants: 40    # must NOT raise E104

messiness:
  xlsx_share: 0.5
  title_row_share: 0.2
  second_batch_share: 0.3
  declared_intake_share: 0.3      # institutions that add an "Approved Intake" column
  prompt_injection_header: 1      # institutions with a hostile header (Gemini mapping test)
